name: Release

# Triggered when a tag named like v1.2.3 is pushed.
# Local flow:
#   1. Edit CHANGELOG.md → add ## [1.2.3] section
#   2. Bump version in todo-app/package.json
#   3. git commit + git tag v1.2.3 + git push --follow-tags
#   4. This workflow builds NSIS + Portable, then creates the GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required by softprops/action-gh-release to create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: todo-app/package-lock.json

      - name: Install dependencies
        working-directory: todo-app
        run: npm ci

      - name: Build NSIS + Portable
        working-directory: todo-app
        run: npm run release:build

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $raw = Get-Content CHANGELOG.md -Raw
          # Match "## [<version>] - <date>" and capture until the next "## [" header (or end of file)
          $escaped = [regex]::Escape($version)
          $pattern = "(?ms)^## \[$escaped\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)"
          $m = [regex]::Match($raw, $pattern)
          if ($m.Success) {
            $body = $m.Groups[1].Value.Trim()
          } else {
            $body = "Release $tag"
          }
          # action-gh-release reads release-notes.md as the release body
          $body | Out-File -FilePath release-notes.md -Encoding utf8 -NoNewline

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            todo-app/dist/TodoApp Setup *.exe
            todo-app/dist/TodoApp [0-9]*.exe
